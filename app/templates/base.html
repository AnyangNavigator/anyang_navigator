<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}안양 균형발전 내비게이터{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
{% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="/dashboard" class="text-lg font-bold text-slate-900">안양 균형발전 내비게이터</a>
      <nav class="flex gap-4 text-sm">
        <a href="/dashboard" class="hover:text-blue-600 {% if active == 'dashboard' %}text-blue-600 font-semibold{% endif %}">대시보드</a>
        <a href="/simulator" class="hover:text-blue-600 {% if active == 'simulator' %}text-blue-600 font-semibold{% endif %}">What-if 시뮬레이터</a>
      </nav>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="max-w-5xl mx-auto px-4 py-6 text-xs text-slate-400">
    데이터 출처: 2025 안양시 사회조사(구 단위), 2025.12.31 주민등록인구통계(행정동 단위). 본 서비스는 정책 우선순위 논의를 위한 의사결정 보조 도구이며 정밀 예측이 아닙니다.
  </footer>
</body>
</html>
