<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}안양 균형발전 내비게이터{% endblock %}</title>
<!-- Tailwind는 Play CDN(런타임 CSS 생성 + 프로덕션 경고) 대신 미리 빌드한 CSS를 쓴다.
     템플릿에 새 유틸리티 클래스를 추가했으면 scripts/build_css.md 절차로 재생성할 것. -->
<link rel="stylesheet" href="/static/app.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
{% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between sm:py-4">
      <a href="/dashboard" class="text-base sm:text-lg font-bold text-slate-900 whitespace-nowrap">안양 균형발전 내비게이터</a>
      <nav class="flex gap-3 sm:gap-4 text-sm">
        <a href="/dashboard" class="whitespace-nowrap hover:text-blue-600 {% if active == 'dashboard' %}text-blue-600 font-semibold{% endif %}">대시보드</a>
        <a href="/simulator" class="whitespace-nowrap hover:text-blue-600 {% if active == 'simulator' %}text-blue-600 font-semibold{% endif %}">What-if 시뮬레이터</a>
        <a href="/about" class="whitespace-nowrap hover:text-blue-600 {% if active == 'about' %}text-blue-600 font-semibold{% endif %}">데이터·방법론</a>
      </nav>
    </div>
  </header>
  <main class="max-w-5xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>
  <footer class="max-w-5xl mx-auto px-4 py-6 text-xs text-slate-400">
    데이터 출처: 2025 안양시 사회조사(구 단위), 2025.12.31 주민등록인구통계(행정동 단위). 본 서비스는 정책 우선순위 논의를 위한 의사결정 보조 도구이며 정밀 예측이 아닙니다.
  </footer>
</body>
</html>
